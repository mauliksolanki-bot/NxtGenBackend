spring.application.name=NxtGen
server.port=8080
spring.profiles.default=production
app.database.table-prefix=NXTGEN_
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.remember-me-expiration-ms=${JWT_REMEMBER_ME_EXPIRATION_MS:2592000000}
app.user.email-domain=${USER_EMAIL_DOMAIN:nxtgen.com}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
springdoc.swagger-ui.defaultModelsExpandDepth=-1
logging.level.com.itsm=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] requestId=%X{requestId:-} actor="%X{actor:-}" api="%X{api:-}" controller=%X{controller:-} action=%X{action:-} service=%X{service:-} services=%X{services:-} logger=%logger{36} - %msg%n%ex
